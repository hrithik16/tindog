<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Contact TinDog</title>

  <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<section class="container py-5">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded mb-5">
    <a href="index.html" class="navbar-brand">TinDog</a>

    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <a href="index.html" class="nav-link">Home</a>
      </li>

      <li class="nav-item">
        <a href="pricing.html" class="nav-link">Pricing</a>
      </li>

      <li class="nav-item">
        <a href="contact.html" class="nav-link">Contact</a>
      </li>
    </ul>
  </nav>

  <div class="text-center">
    <h1 class="mb-4">Contact Us</h1>

    <p class="lead">
      We'd love to hear from you and your dog.
    </p>
  </div>

  <div class="row justify-content-center mt-5">

    <div class="col-lg-6">

      <form>

        <div class="form-group">
          <label>Name</label>

          <input
            type="text"
            class="form-control"
            placeholder="Enter your name"
          >
        </div>

        <div class="form-group">
          <label>Email</label>

          <input
            type="email"
            class="form-control"
            placeholder="Enter your email"
          >
        </div>

        <div class="form-group">
          <label>Message</label>

          <textarea
            class="form-control"
            rows="5"
            placeholder="Your message"
          ></textarea>
        </div>

        <button class="btn btn-dark btn-block">
          Send Message
        </button>

      </form>

    </div>

  </div>

</section>

<script src="../tracker/tracker.js"></script>

</body>
</html>
